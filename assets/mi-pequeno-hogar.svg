<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Mi pequeño hogar</title><desc id="desc">Una casita acogedora entre plantas bajo la lluvia nocturna, con ventanas iluminadas y un pequeño hámster amarillo.</desc>
<defs>
